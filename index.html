<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إذاعة القرآن الكريم الجامعة</title>
    <style>
        :root { --accent: #f1c40f; --green: #42e695; --red: #ff4757; --dark-bg: #0f172a; }
        
        body {
            margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh; display: flex; justify-content: center; 
            align-items: center; color: white; padding: 15px; box-sizing: border-box;
        }

        .container {
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px);
            padding: 25px 20px; border-radius: 20px; text-align: center;
            width: 100%; max-width: 420px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .main-title { color: var(--accent); font-weight: bold; margin-bottom: 20px; font-size: 1.6rem; text-shadow: 0 2px 10px rgba(241, 196, 15, 0.3); }

        .sections-container { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        
        .mode-btn { 
            padding: 12px; border-radius: 12px; border: none; cursor: pointer; 
            background: #333; color: white; font-weight: bold; font-size: 0.85rem; 
            transition: 0.3s; 
        }
        .active-mode { background: var(--accent); color: black; box-shadow: 0 0 15px var(--accent); }
        .full-width { grid-column: span 2; }

        input[type="text"], select { 
            width: 100%; padding: 14px; border-radius: 12px; border: none; 
            margin-bottom: 12px; background: white; color: #333; 
            font-size: 1rem; font-weight: bold; outline: none; box-sizing: border-box; text-align: right;
        }

        /* قسم خيارات الأطفال المطور */
        #childOptions {
            display: none; background: rgba(241, 196, 15, 0.15);
            padding: 15px; border-radius: 15px; border: 1px solid var(--accent);
            margin-bottom: 15px; text-align: right;
        }
        .option-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .option-row label { font-size: 0.85rem; font-weight: bold; color: var(--accent); }
        .option-row select { width: 45%; margin:0; padding:5px; font-size: 0.8rem; height: 35px; }

        .range-box { display: flex; gap: 10px; margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; }
        .range-box select { padding: 5px; font-size: 0.75rem; background: #fff; height: 35px; }

        .repeat-box { 
            background: rgba(255,255,255,0.1); padding: 12px; border-radius: 12px; 
            margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; 
        }

        .progress-box { margin: 15px 0; display: flex; align-items: center; gap: 12px; font-size: 0.85rem; }
        input[type="range"] { flex: 1; cursor: pointer; accent-color: var(--green); }

        .controls { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 10px; }
        
        .play-btn { 
            background: var(--green); border: none; width: 75px; height: 75px; 
            border-radius: 50%; font-size: 1.8rem; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; 
            color: black; transition: 0.2s; box-shadow: 0 5px 15px rgba(66, 230, 149, 0.3); 
        }
        .nav-btn { background: rgba(255,255,255,0.1); border: none; color: white; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; }

        .footer { margin-top: 25px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 0.8rem; color: var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <div class="main-title">إذاعة القرآن الكريم </div>
    
    <div class="sections-container">
        <button class="mode-btn active-mode" id="allMode">📖 المصحف المرتل</button>
        <button class="mode-btn" id="mojawadMode">🎤 المصحف المجود</button>
        <button class="mode-btn full-width" id="childMode">👶 قسم الأطفال (المعلم)</button>
    </div>

    <div id="childOptions">
        <div class="option-row">
            <label>🔁 تكرار (نمط تعليمي):</label>
            <select id="verseRepeatSelect">
                <option value="1">مرة واحدة</option>
                <option value="3">3 مرات</option>
                <option value="5">5 مرات</option>
                <option value="7">7 مرات</option>
            </select>
        </div>
        
        <div style="text-align: right; margin-top: 10px;">
            <label style="font-size: 0.85rem; color: #fff; cursor: pointer;">
                <input type="checkbox" id="useRange" checked> تفعيل نطاق (القارعة - الناس)
            </label>
            <div class="range-box">
                <select id="rangeStart"></select>
                <span style="align-self: center; font-size: 0.7rem;">إلى</span>
                <select id="rangeEnd"></select>
            </div>
        </div>
    </div>

    <input type="text" id="searchReciter" placeholder="🔍  ابحث عن قارئ...">
    <select id="reciterSelect"></select>
    <select id="surahSelect"></select>

    <div class="repeat-box" id="normalRepeatBox">
        <label style="font-size: 0.9rem; font-weight: bold;">🔁 تكرار السورة:</label>
        <select id="repeatSelect" style="width: auto; margin:0; padding:5px;"></select>
    </div>
    
    <div id="repeatStatus" style="font-size: 0.85rem; color: var(--accent); margin-bottom: 10px; min-height: 1.2em;"></div>

    <div class="progress-box">
        <span id="currentTime">0:00</span>
        <input type="range" id="seekSlider" value="0" min="0" step="1">
        <span id="duration">0:00</span>
    </div>

    <div class="controls">
        <button id="prevBtn" class="nav-btn">⏭</button>
        <button id="playBtn" class="play-btn">▶</button>
        <button id="nextBtn" class="nav-btn">⏮</button>
    </div>

    <div class="footer">صدقة جارية لجميع موتى المسلمين - أبو نواف</div>
</div>

<audio id="audioPlayer" preload="auto"></audio>

<script>
    const reciterSelect = document.getElementById('reciterSelect');
    const surahSelect = document.getElementById('surahSelect');
    const repeatSelect = document.getElementById('repeatSelect');
    const childOptions = document.getElementById('childOptions');
    const normalRepeatBox = document.getElementById('normalRepeatBox');
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const repeatStatus = document.getElementById('repeatStatus');
    const rangeStart = document.getElementById('rangeStart');
    const rangeEnd = document.getElementById('rangeEnd');
    const useRange = document.getElementById('useRange');
    const verseRepeatSelect = document.getElementById('verseRepeatSelect');
    const seekSlider = document.getElementById('seekSlider');

    let allReciters = [];
    let currentRepeat = 1;
    let currentMode = 'مرتل';

    const surahNames = ["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];

    function fillSurahs() {
        surahSelect.innerHTML = ''; rangeStart.innerHTML = ''; rangeEnd.innerHTML = '';
        surahNames.forEach((n, i) => {
            let v = (i+1).toString().padStart(3, '0');
            let opt = `<option value="${v}">${i+1}. ${n}</option>`;
            surahSelect.innerHTML += opt;
            rangeStart.innerHTML += opt;
            rangeEnd.innerHTML += opt;
        });
        rangeStart.value = "101"; rangeEnd.value = "114";
    }

    async function init() {
        const res = await fetch("https://mp3quran.net/api/v3/reciters?language=ar");
        const data = await res.json();
        allReciters = data.reciters.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
        fillSurahs();
        filterReciters();
        for(let i=1; i<=20; i++) {
            let opt = document.createElement('option');
            opt.value = i; opt.text = i == 1 ? "بدون تكرار" : `${i} مرات`;
            repeatSelect.appendChild(opt);
        }
    }

    function filterReciters(term = "") {
        reciterSelect.innerHTML = '<option value="">-- اختر القارئ --</option>';
        allReciters.filter(r => term === "" || r.name.includes(term)).forEach(r => {
            let found = r.moshaf.find(m => currentMode === 'معلم' ? m.name.includes("معلم") : (currentMode === 'مجود' ? m.name.includes("مجود") : (m.name.includes("مرتل") || m.name === "حفص عن عاصم")));
            if(found) {
                const opt = document.createElement('option');
                opt.value = found.server; opt.text = r.name;
                reciterSelect.appendChild(opt);
            }
        });
    }

    function autoPlay() {
        if(!reciterSelect.value) return;
        audio.src = `${reciterSelect.value}${surahSelect.value}.mp3`;
        currentRepeat = 1;
        updateStatus();
        audio.play();
    }

    audio.onended = () => {
        let max = (currentMode === 'معلم') ? parseInt(verseRepeatSelect.value) : parseInt(repeatSelect.value);
        if (currentRepeat < max) {
            currentRepeat++;
            updateStatus();
            audio.currentTime = 0;
            audio.play();
        } else {
            if (currentMode === 'معلم' && useRange.checked) {
                let end = parseInt(rangeEnd.value);
                let curr = parseInt(surahSelect.value);
                if (curr < end) {
                    surahSelect.value = (curr + 1).toString().padStart(3, '0');
                    autoPlay();
                } else {
                    repeatStatus.innerText = "✅ تم الانتهاء من النطاق المحدد";
                }
            } else {
                document.getElementById('nextBtn').click();
            }
        }
    };

    function updateStatus() {
        let max = (currentMode === 'معلم') ? verseRepeatSelect.value : repeatSelect.value;
        repeatStatus.innerText = max > 1 ? `تكرار: ${currentRepeat} من ${max}` : "جاري الاستماع...";
    }

    playBtn.onclick = () => audio.paused ? audio.play() : audio.pause();
    audio.onplay = () => playBtn.innerText = "⏸";
    audio.onpause = () => playBtn.innerText = "▶";

    document.getElementById('nextBtn').onclick = () => { if(surahSelect.selectedIndex < 113) { surahSelect.selectedIndex++; autoPlay(); } };
    document.getElementById('prevBtn').onclick = () => { if(surahSelect.selectedIndex > 0) { surahSelect.selectedIndex--; autoPlay(); } };

    reciterSelect.onchange = autoPlay;
    surahSelect.onchange = autoPlay;
    document.getElementById('searchReciter').oninput = (e) => filterReciters(e.target.value);

    document.getElementById('allMode').onclick = function() { switchMode('مرتل', this); };
    document.getElementById('mojawadMode').onclick = function() { switchMode('مجود', this); };
    document.getElementById('childMode').onclick = function() { switchMode('معلم', this); };

    function switchMode(mode, btn) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active-mode'));
        btn.classList.add('active-mode');
        childOptions.style.display = (mode === 'معلم') ? 'block' : 'none';
        normalRepeatBox.style.display = (mode === 'معلم') ? 'none' : 'flex';
        filterReciters();
        audio.pause();
    }

    audio.ontimeupdate = () => {
        if(!isNaN(audio.duration)) {
            seekSlider.value = (audio.currentTime/audio.duration)*100;
            document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
            document.getElementById('duration').innerText = formatTime(audio.duration);
        }
    };
    seekSlider.oninput = () => audio.currentTime = audio.duration * (seekSlider.value/100);
    function formatTime(s) { let m=Math.floor(s/60), sc=Math.floor(s%60); return `${m}:${sc<10?'0'+sc:sc}`; }

    init();
</script>
</body>
</html>
