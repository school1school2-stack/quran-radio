<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إذاعة القرآن الكريم الجامعة</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2663/2663339.png" type="image/png">
    <style>
        :root { --accent: #f1c40f; --green: #42e695; --red: #ff4757; }
        body {
            margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            background-size: cover; background-attachment: fixed;
            min-height: 100vh; display: flex; justify-content: center; 
            align-items: center; color: white; padding: 10px; box-sizing: border-box;
        }
        .container {
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px);
            padding: 20px; border-radius: 20px; text-align: center;
            width: 100%; max-width: 450px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .main-title { color: var(--accent); font-weight: bold; margin-bottom: 5px; font-size: 1.4rem; }
        .sub-title { color: var(--green); font-size: 0.9rem; margin-bottom: 20px; opacity: 0.9; }
        
        .sections-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .mode-btn { padding: 14px; border-radius: 12px; border: none; cursor: pointer; background: #333; color: white; font-weight: bold; font-size: 1rem; transition: 0.3s; width: 100%; }
        .active-mode { background: var(--accent); color: black; box-shadow: 0 0 15px var(--accent); }

        input[type="text"], select {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            margin-bottom: 12px; font-weight: bold; outline: none; box-sizing: border-box;
            background: white; color: #333; font-size: 1rem;
        }

        .repeat-box { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 12px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        .repeat-box label { font-size: 0.9rem; font-weight: bold; }
        .repeat-box select { width: auto; margin: 0; padding: 5px 10px; }

        .progress-box { margin: 15px 0; display: flex; align-items: center; gap: 12px; font-size: 0.85rem; }
        input[type="range"] { flex: 1; cursor: pointer; accent-color: var(--green); }

        .controls { display: flex; justify-content: center; align-items: center; gap: 25px; margin-top: 10px; }
        .play-btn { background: var(--green); border: none; width: 65px; height: 65px; border-radius: 50%; font-size: 1.6rem; cursor: pointer; display: flex; align-items: center; justify-content: center; color: black; transition: 0.2s; }
        
        .footer { margin-top: 25px; font-size: 0.85rem; line-height: 1.6; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .repeat-status { font-size: 0.8rem; color: var(--accent); margin-top: 5px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-title">إذاعة القرآن الكريم الجامعة</div>
    <div class="sub-title">إشراف وتطوير أبو نواف</div>

    <div class="sections-container">
        <button class="mode-btn active-mode" id="allMode">📖 القرآن الكريم كامل</button>
        <button class="mode-btn" id="childMode">👶 قسم الأطفال (المصحف المعلم)</button>
    </div>

    <input type="text" id="searchReciter" placeholder="🔍 ابحث عن اسم القارئ...">
    <select id="reciterSelect"><option value="">جاري تحميل قائمة القراء...</option></select>
    <select id="surahSelect"></select>

    <div class="repeat-box">
        <label>🔁 عدد مرات تكرار السورة:</label>
        <select id="repeatSelect">
            </select>
    </div>
    <div id="repeatStatus" class="repeat-status">متبقي للتكرار: 0</div>

    <div class="progress-box">
        <span id="currentTime">0:00</span>
        <input type="range" id="seekSlider" value="0" min="0" step="1">
        <span id="duration">0:00</span>
    </div>

    <div class="controls">
        <button id="playBtn" class="play-btn">▶</button>
    </div>

    <div class="footer">
        الحقوق محفوظة <br>
        صدقة جارية لوجه الله تعالى <br>
        <b>أبو نواف</b>
    </div>
</div>

<audio id="audioPlayer"></audio>
