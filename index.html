<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إذاعة القرآن الكريم الجامعة</title>
    <style>
        :root { --accent: #f1c40f; --green: #42e695; --red: #ff4757; }
        body {
            margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            background-size: cover; background-attachment: fixed;
            min-height: 100vh; display: flex; justify-content: center; 
            align-items: center; color: white; padding: 10px; box-sizing: border-box;
        }
        .container {
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px);
            padding: 25px 20px; border-radius: 20px; text-align: center;
            width: 100%; max-width: 450px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .main-title { color: var(--accent); font-weight: bold; margin-bottom: 25px; font-size: 1.6rem; text-shadow: 0 2px 10px rgba(241, 196, 15, 0.3); }
        
        .sections-container { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
        .mode-btn { padding: 12px; border-radius: 12px; border: none; cursor: pointer; background: #333; color: white; font-weight: bold; font-size: 0.85rem; transition: 0.3s; }
        .active-mode { background: var(--accent); color: black; box-shadow: 0 0 10px var(--accent); }
        .full-width { grid-column: span 2; }

        input[type="text"], select {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            margin-bottom: 12px; font-weight: bold; outline: none; box-sizing: border-box;
            background: white; color: #333; font-size: 1rem;
        }

        .repeat-box { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 12px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        .repeat-box label { font-size: 0.85rem; font-weight: bold; }
        .repeat-box select { width: auto; margin: 0; padding: 5px 10px; background: white; color: black; font-size: 0.9rem; }

        .progress-box { margin: 15px 0; display: flex; align-items: center; gap: 12px; font-size: 0.85rem; }
        input[type="range"] { flex: 1; cursor: pointer; accent-color: var(--green); }

        .controls { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 10px; }
        .play-btn { background: var(--green); border: none; width: 70px; height: 70px; border-radius: 50%; font-size: 1.8rem; cursor: pointer; display: flex; align-items: center; justify-content: center; color: black; transition: 0.2s; box-shadow: 0 5px 15px rgba(66, 230, 149, 0.3); }
        .nav-btn { background: rgba(255,255,255,0.1); border: none; color: white; width: 45px; height: 45px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .fav-btn { background: none; border: 2px solid var(--red); color: var(--red); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .fav-btn.active { background: var(--red); color: white; box-shadow: 0 0 15px var(--red); }
        
        .footer { margin-top: 30px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
        .footer-text { color: var(--accent); font-size: 0.75rem; text-decoration: underline; letter-spacing: 0.5px; }
        .repeat-status { font-size: 0.8rem; color: var(--accent); margin-top: 5px; font-weight: bold; min-height: 1.2em; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-title">إذاعة القرآن الكريم </div>

    <div class="sections-container">
        <button class="mode-btn active-mode" id="allMode">📖 المصحف المرتل</button>
        <button class="mode-btn" id="mojawadMode">🎤 المصحف المجود</button>
        <button class="mode-btn full-width" id="childMode">👶 قسم الأطفال (المصحف المعلم)</button>
    </div>

    <input type="text" id="searchReciter" placeholder="🔍 ابحث عن قارئ...">
    <select id="reciterSelect"></select>
    <select id="surahSelect"></select>

    <div class="repeat-box">
        <label>🔁 تكرار السورة آلياً:</label>
        <select id="repeatSelect"></select>
    </div>
    <div id="repeatStatus" class="repeat-status"></div>

    <div class="progress-box">
        <span id="currentTime">0:00</span>
        <input type="range" id="seekSlider" value="0" min="0" step="1">
        <span id="duration">0:00</span>
    </div>

    <div class="controls">
        <button id="prevBtn" class="nav-btn" title="السورة السابقة">⏭</button>
        <button id="addFav" class="fav-btn" title="إضافة للمفضلة">❤</button>
        <button id="playBtn" class="play-btn">▶</button>
        <button id="nextBtn" class="nav-btn" title="السورة التالية">⏮</button>
    </div>

    <div class="footer">
        <div class="footer-text">صدقة جارية لجميع موتى المسلمين - أبو نواف</div>
    </div>
</div>

<audio id="audioPlayer" preload="auto"></audio>

<script>
    const reciterSelect = document.getElementById('reciterSelect');
    const surahSelect = document.getElementById('surahSelect');
    const repeatSelect = document.getElementById('repeatSelect');
    const repeatStatus = document.getElementById('repeatStatus');
    const playBtn = document.getElementById('playBtn');
    const audio = document.getElementById('audioPlayer');
    const seekSlider = document.getElementById('seekSlider');
    const favBtn = document.getElementById('addFav');
    
    let allReciters = [];
    let currentRepeat = 1;
    let favorites = JSON.parse(localStorage.getItem('quranFavs')) || [];
    let currentMode = 'مرتل';

    const surahNames = ["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];

    for(let i=1; i<=20; i++) {
        let opt = document.createElement('option');
        opt.value = i;
        opt.text = i == 1 ? "بدون تكرار" : `${i} مرات`;
        repeatSelect.appendChild(opt);
    }

    async function init() {
        try {
            const res = await fetch("https://mp3quran.net/api/v3/reciters?language=ar");
            const data = await res.json();
            allReciters = data.reciters.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
            filterReciters(); 
            loadSurahs(false);
        } catch(e) { reciterSelect.innerHTML = '<option>فشل التحميل</option>'; }
    }

    function playAudioSafe() {
        const playPromise = audio.play();
        if (playPromise !== undefined) {
            playPromise.then(_ => {
                updateMediaSession();
            }).catch(e => {
                repeatStatus.innerText = "اضغط على زر التشغيل للبدء";
            });
        }
    }

    function updateMediaSession() {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: surahSelect.options[surahSelect.selectedIndex].text,
                artist: reciterSelect.options[reciterSelect.selectedIndex].text,
                album: 'إذاعة القرآن الكريم'
            });
        }
    }

    function autoPlayTrack() {
        if(!reciterSelect.value || !surahSelect.value) return;
        audio.src = `${reciterSelect.value}${surahSelect.value}.mp3`;
        currentRepeat = 1;
        updateStatus();
        checkFavStatus();
        audio.load();
        playAudioSafe();
    }

    function filterReciters(term = "") {
        reciterSelect.innerHTML = '<option value="">-- اختر القارئ --</option>';
        if (term === "") {
            let favGroup = document.createElement('optgroup');
            favGroup.label = "⭐ القراء المفضلون";
            let hasFavs = false;
            favorites.filter(f => f.mode === currentMode).sort((a, b) => a.name.localeCompare(b.name, 'ar')).forEach(f => {
                let opt = document.createElement('option');
                opt.value = f.server;
                opt.text = "❤️ " + f.name;
                favGroup.appendChild(opt);
                hasFavs = true;
            });
            if(hasFavs) reciterSelect.appendChild(favGroup);
        }

        let allGroup = document.createElement('optgroup');
        allGroup.label = term === "" ? "📋 القائمة الأبجدية" : "🔍 نتائج البحث";
        allReciters.filter(r => term === "" || r.name.toLowerCase().includes(term.toLowerCase())).forEach(r => {
            let found = r.moshaf.find(m => currentMode === 'معلم' ? m.name.includes("معلم") : (currentMode === 'مجود' ? m.name.includes("مجود") : (m.name.includes("مرتل") || m.name === "حفص عن عاصم")));
            if(found) {
                const opt = document.createElement('option');
                opt.value = found.server;
                opt.text = r.name;
                allGroup.appendChild(opt);
            }
        });
        reciterSelect.appendChild(allGroup);
    }

    function loadSurahs(isAmma) {
        const prev = surahSelect.value;
        surahSelect.innerHTML = '';
        const start = isAmma ? 77 : 0;
        surahNames.forEach((n, i) => {
            if(i >= start || i === 0) {
                const opt = document.createElement('option');
                opt.value = (i+1).toString().padStart(3, '0');
                opt.text = `${i+1}. ${n}`;
                surahSelect.appendChild(opt);
            }
        });
        if(prev && !isAmma) surahSelect.value = prev;
    }

    playBtn.onclick = () => {
        if(!audio.src) autoPlayTrack();
        else audio.paused ? playAudioSafe() : audio.pause();
    };

    document.getElementById('nextBtn').onclick = () => {
        if(surahSelect.selectedIndex < surahSelect.options.length - 1) {
            surahSelect.selectedIndex++;
            autoPlayTrack();
        }
    };

    document.getElementById('prevBtn').onclick = () => {
        if(surahSelect.selectedIndex > 0) {
            surahSelect.selectedIndex--;
            autoPlayTrack();
        }
    };

    function updateStatus() {
        let max = parseInt(repeatSelect.value);
        repeatStatus.innerText = max > 1 ? `التكرار الحالي: ${currentRepeat} من ${max}` : "جاري الاستماع الآن...";
        repeatStatus.style.display = "block";
    }

    audio.onplay = () => playBtn.innerText = "⏸";
    audio.onpause = () => playBtn.innerText = "▶";
    audio.onerror = () => {
        repeatStatus.innerText = "⚠️ عذراً، الملف غير متوفر لهذا القارئ";
        repeatStatus.style.color = "var(--red)";
    };

    audio.onended = () => {
        let max = parseInt(repeatSelect.value);
        if (currentRepeat < max) {
            currentRepeat++;
            updateStatus();
            audio.currentTime = 0;
            playAudioSafe();
        } else {
            document.getElementById('nextBtn').click();
        }
    };

    audio.ontimeupdate = () => { if(!isNaN(audio.duration)) { seekSlider.value = (audio.currentTime/audio.duration)*100; document.getElementById('currentTime').innerText = formatTime(audio.currentTime); document.getElementById('duration').innerText = formatTime(audio.duration); } };
    seekSlider.oninput = () => audio.currentTime = audio.duration * (seekSlider.value/100);
    function formatTime(s) { let m=Math.floor(s/60), sc=Math.floor(s%60); return `${m}:${sc<10?'0'+sc:sc}`; }

    favBtn.onclick = () => {
        const server = reciterSelect.value;
        if(!server) return;
        let name = reciterSelect.options[reciterSelect.selectedIndex].text.replace("❤️ ", "");
        const idx = favorites.findIndex(f => f.server === server);
        if(idx === -1) favorites.push({server, name, mode: currentMode});
        else favorites.splice(idx, 1);
        localStorage.setItem('quranFavs', JSON.stringify(favorites));
        filterReciters(document.getElementById('searchReciter').value);
        reciterSelect.value = server;
        checkFavStatus();
    };

    function checkFavStatus() {
        const exists = favorites.some(f => f.server === reciterSelect.value);
        favBtn.classList.toggle('active', exists);
    }

    reciterSelect.onchange = autoPlayTrack;
    surahSelect.onchange = autoPlayTrack;
    document.getElementById('searchReciter').oninput = (e) => filterReciters(e.target.value);

    const modes = { 'allMode': 'مرتل', 'mojawadMode': 'مجود', 'childMode': 'معلم' };
    Object.keys(modes).forEach(id => {
        document.getElementById(id).onclick = function() {
            currentMode = modes[id];
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active-mode'));
            this.classList.add('active-mode');
            loadSurahs(currentMode === 'معلم');
            filterReciters();
            audio.pause();
            playBtn.innerText = "▶";
        };
    });

    init();
</script>
</body>
</html>
