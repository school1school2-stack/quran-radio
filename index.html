<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إذاعة القرآن الكريم الشاملة</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        .radio-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 350px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        h2 { color: #42e695; margin-bottom: 10px; font-size: 1.8rem; }
        p { color: #ccc; font-size: 0.9rem; margin-bottom: 30px; }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background: #fff;
            color: #333;
            font-weight: bold;
            border: none;
            margin-bottom: 25px;
            cursor: pointer;
            outline: none;
        }

        .play-btn {
            background: #42e695;
            color: #000;
            border: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            box-shadow: 0 0 20px rgba(66, 230, 149, 0.4);
        }

        .play-btn:hover { transform: scale(1.1); background: #34d082; }

        /* الأشرطة المتحركة عند التشغيل */
        .waves {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 30px;
            gap: 4px;
            margin-top: 25px;
            opacity: 0;
        }

        .waves.active { opacity: 1; }

        .wave-bar {
            width: 4px;
            height: 10px;
            background: #42e695;
            border-radius: 2px;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { height: 10px; }
            50% { height: 30px; }
        }
    </style>
</head>
<body>

<div class="radio-card">
    <h2>إذاعة القرآن الكريم</h2>
    <p id="stationName">اختر القارئ واستمع للذكر الحكيم</p>

    <select id="radioStations">
        <option value="">-- اختر من القائمة --</option>
    </select>

    <button class="play-btn" id="mainBtn">▶</button>

    <div class="waves" id="waveContainer">
        <div class="wave-bar" style="animation-delay: 0.1s"></div>
        <div class="wave-bar" style="animation-delay: 0.3s"></div>
        <div class="wave-bar" style="animation-delay: 0.5s"></div>
        <div class="wave-bar" style="animation-delay: 0.2s"></div>
        <div class="wave-bar" style="animation-delay: 0.4s"></div>
    </div>
</div>

<audio id="player"></audio>

<script>
    const player = document.getElementById('player');
    const select = document.getElementById('radioStations');
    const btn = document.getElementById('mainBtn');
    const waves = document.getElementById('waveContainer');
    const stationNameText = document.getElementById('stationName');

    // هذه البيانات مدمجة وتعمل تلقائياً دون أي تدخل منك
    const apiURL = "https://mp3quran.net/api/v3/radios?language=ar";

    async function loadRadios() {
        try {
            const response = await fetch(apiURL);
            const data = await response.json();
            
            data.radios.forEach(radio => {
                let option = document.createElement('option');
                option.value = radio.url;
                option.text = radio.name;
                select.appendChild(option);
            });
        } catch (error) {
            stationNameText.innerText = "تعذر الاتصال، تأكد من الإنترنت";
        }
    }

    btn.onclick = () => {
        if (!select.value) {
            alert("يرجى اختيار إذاعة أولاً");
            return;
        }

        if (player.paused) {
            player.src = select.value;
            player.play();
            btn.innerText = "⏸";
            waves.classList.add('active');
            stationNameText.innerText = "جاري الاستماع لـ: " + select.options[select.selectedIndex].text;
        } else {
            player.pause();
            btn.innerText = "▶";
            waves.classList.remove('active');
            stationNameText.innerText = "تم الإيقاف";
        }
    };

    // تحميل الإذاعات تلقائياً عند فتح الصفحة
    loadRadios();
</script>

</body>
</html>
