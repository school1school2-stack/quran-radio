<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إذاعة القرآن الكريم الجامعة</title>
    <style>
        :root { --accent: #f1c40f; --green: #42e695; --red: #ff4757; --blue: #3498db; --dark: #0f172a; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #1e3c72, #2a5298); min-height: 100vh; display: flex; justify-content: center; align-items: center; color: white; padding: 15px; box-sizing: border-box; }
        .container { background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px); padding: 25px 20px; border-radius: 20px; text-align: center; width: 100%; max-width: 420px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 15px 35px rgba(0,0,0,0.5); box-sizing: border-box; }
        .main-title { color: var(--accent); font-weight: bold; margin-bottom: 20px; font-size: 1.6rem; }
        .sections-container { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .mode-btn { padding: 12px; border-radius: 12px; border: none; cursor: pointer; background: #333; color: white; font-weight: bold; font-size: 0.85rem; transition: 0.3s; }
        .active-mode { background: var(--accent); color: black; box-shadow: 0 0 15px var(--accent); }
        .full-width { grid-column: span 2; }
        input[type="text"], select { width: 100%; padding: 14px; border-radius: 12px; border: none; margin-bottom: 10px; background: white; color: #333; font-size: 1rem; font-weight: bold; box-sizing: border-box; text-align: right; outline: none; }
        #childFeatures { display: none; background: rgba(52, 152, 219, 0.15); padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px dashed var(--blue); text-align: right; }
        .feat-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 0.85rem; }
        .feat-row select { width: 45%; padding: 8px; margin: 0; font-size: 0.85rem; }
        .repeat-box { background: rgba(255,255,255,0.1); padding: 12px; border-radius: 12px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        .progress-box { margin: 15px 0; display: flex; align-items: center; gap: 12px; font-size: 0.85rem; }
        input[type="range"] { flex: 1; accent-color: var(--green); cursor: pointer; }
        .controls { display: flex; justify-content: center; align-items: center; gap: 15px; }
        .play-btn { background: var(--green); border: none; width: 75px; height: 75px; border-radius: 50%; font-size: 1.8rem; cursor: pointer; display: flex; align-items: center; justify-content: center; color: black; }
        .nav-btn, .fav-btn { background: rgba(255,255,255,0.1); border: none; color: white; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .fav-btn.active { background: var(--red); color: white; }
        .footer { margin-top: 25px; font-size: 0.8rem; color: var(--accent); border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-title">إذاعة القرآن الكريم </div>

    <div class="sections-container">
        <button class="mode-btn active-mode" id="allMode">📖 المصحف المرتل</button>
        <button class="mode-btn" id="mojawadMode">🎤 المصحف المجود</button>
        <button class="mode-btn full-width" id="childMode">👶 قسم الأطفال (المعلم)</button>
    </div>

    <div id="childFeatures">
        <div style="color:var(--blue); font-weight:bold; margin-bottom:10px;">🛠 أدوات التحفيظ:</div>
        <div class="feat-row"><span>🔄 تكرار الآية:</span><select id="verseRepeat"><option value="1">بدون تكرار</option><option value="3">3 مرات</option><option value="5">5 مرات</option><option value="0">تكرار مستمر</option></select></div>
        <div class="feat-row"><span>📂 مراجعة من:</span><select id="surahFrom"></select></div>
        <div class="feat-row"><span>📂 مراجعة إلى:</span><select id="surahTo"></select></div>
    </div>

    <input type="text" id="searchReciter" placeholder="🔍  ابحث عن قارئ...">
    <select id="reciterSelect"><option value="">جاري جلب القراء...</option></select>
    <select id="surahSelect"></select>

    <div class="repeat-box">
        <label style="font-size: 0.85rem;">🔁 تكرار السورة بالكامل:</label>
        <select id="repeatSelect" style="width: auto; padding: 5px; margin: 0;"></select>
    </div>

    <div id="statusLabel" style="font-size: 0.8rem; color: var(--accent); margin-bottom: 10px; min-height: 1.2em;"></div>

    <div class="progress-box">
        <span id="currentTime">0:00</span>
        <input type="range" id="seekSlider" value="0">
        <span id="duration">0:00</span>
    </div>

    <div class="controls">
        <button id="prevBtn" class="nav-btn">⏭</button>
        <button id="addFav" class="nav-btn" style="color:var(--red); border:1px solid var(--red);">❤</button>
        <button id="playBtn" class="play-btn">▶</button>
        <button id="nextBtn" class="nav-btn">⏮</button>
    </div>

    <div class="footer">صدقة جارية لجميع موتى المسلمين - أبو نواف</div>
</div>

<audio id="audioPlayer"></audio>

<script>
    const audio = document.getElementById('audioPlayer');
    const reciterSelect = document.getElementById('reciterSelect');
    const surahSelect = document.getElementById('surahSelect');
    const statusLabel = document.getElementById('statusLabel');
    const seekSlider = document.getElementById('seekSlider');
    const playBtn = document.getElementById('playBtn');
    
    let allReciters = [];
    let currentMode = 'مرتل';
    let favorites = JSON.parse(localStorage.getItem('quranFavs')) || [];
    let verseCount = 0;

    const surahNames = ["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];

    function setup() {
        for(let i=1; i<=20; i++) document.getElementById('repeatSelect').add(new Option(i==1?"بدون تكرار":`${i} مرات`, i));
        surahNames.forEach((n, i) => {
            let val = (i+1).toString().padStart(3, '0');
            document.getElementById('surahFrom').add(new Option(n, val));
            document.getElementById('surahTo').add(new Option(n, val));
        });
        document.getElementById('surahFrom').value = "078";
        document.getElementById('surahTo').value = "114";
        loadSurahs(false);
    }

    async function init() {
        try {
            const res = await fetch("https://mp3quran.net/api/v3/reciters?language=ar");
            const data = await res.json();
            allReciters = data.reciters;
            filterReciters();
            
            const last = JSON.parse(localStorage.getItem('lastSession'));
            if (last) {
                currentMode = last.mode;
                updateModeUI();
                reciterSelect.value = last.server;
                surahSelect.value = last.surah;
                audio.src = `${last.server}${last.surah}.mp3`;
                audio.currentTime = last.time;
            }
        } catch(e) { statusLabel.innerText = "فشل الاتصال بالسيرفر"; }
    }

    function filterReciters(term = "") {
        reciterSelect.innerHTML = '<option value="">-- اختر القارئ --</option>';
        let list = allReciters.filter(r => r.name.includes(term));
        list.forEach(r => {
            let m = r.moshaf.find(x => {
                if(currentMode === 'معلم') return x.name.includes("معلم");
                if(currentMode === 'مجود') return x.name.includes("مجود");
                return x.name.includes("مرتل") || x.name.includes("حفص");
            });
            if(m) reciterSelect.add(new Option(r.name, m.server));
        });
    }

    function loadSurahs(isAmma) {
        surahSelect.innerHTML = '';
        surahNames.forEach((n, i) => {
            if(!isAmma || i >= 77 || i === 0) surahSelect.add(new Option(`${i+1}. ${n}`, (i+1).toString().padStart(3, '0')));
        });
    }

    function play() {
        if(!reciterSelect.value) return;
        audio.src = `${reciterSelect.value}${surahSelect.value}.mp3`;
        audio.play();
        verseCount = 0;
    }

    audio.onended = () => {
        if(currentMode === 'معلم') {
            let vRep = parseInt(document.getElementById('verseRepeat').value);
            if(vRep === 0 || verseCount < vRep - 1) { verseCount++; audio.currentTime = 0; audio.play(); return; }
            if(surahSelect.value < document.getElementById('surahTo').value) { surahSelect.selectedIndex++; play(); return; }
        }
        document.getElementById('nextBtn').click();
    };

    function updateModeUI() {
        document.querySelectorAll('.mode-btn').forEach(x => x.classList.remove('active-mode'));
        document.getElementById(currentMode==='معلم'?'childMode':(currentMode==='مجود'?'mojawadMode':'allMode')).classList.add('active-mode');
        document.getElementById('childFeatures').style.display = currentMode==='معلم'?'block':'none';
    }

    document.getElementById('childMode').onclick = () => { currentMode='معلم'; updateModeUI(); loadSurahs(true); filterReciters(); };
    document.getElementById('allMode').onclick = () => { currentMode='مرتل'; updateModeUI(); loadSurahs(false); filterReciters(); };
    document.getElementById('mojawadMode').onclick = () => { currentMode='مجود'; updateModeUI(); loadSurahs(false); filterReciters(); };

    reciterSelect.onchange = play;
    surahSelect.onchange = play;
    playBtn.onclick = () => audio.paused ? audio.play() : audio.pause();
    document.getElementById('nextBtn').onclick = () => { surahSelect.selectedIndex++; play(); };
    document.getElementById('prevBtn').onclick = () => { surahSelect.selectedIndex--; play(); };
    document.getElementById('searchReciter').oninput = (e) => filterReciters(e.target.value);
    
    audio.ontimeupdate = () => { if(!isNaN(audio.duration)) { seekSlider.value = (audio.currentTime/audio.duration)*100; document.getElementById('currentTime').innerText = fmt(audio.currentTime); document.getElementById('duration').innerText = fmt(audio.duration); } };
    seekSlider.oninput = () => audio.currentTime = audio.duration * (seekSlider.value/100);
    function fmt(s) { let m=Math.floor(s/60), sc=Math.floor(s%60); return `${m}:${sc<10?'0'+sc:sc}`; }
    audio.onplay = () => playBtn.innerText = "⏸";
    audio.onpause = () => playBtn.innerText = "▶";

    setup();
    init();
</script>
</body>
</html>
