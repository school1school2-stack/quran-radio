<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>إذاعة القرآن الكريم والتفسير</title>
<style>
:root { --accent: #f1c40f; --green: #42e695; --red: #ff4757; --dark-bg: #0f172a; }
​body {
margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif;
background: linear-gradient(135deg, #1e3c72, #2a5298);
min-height: 100vh; display: flex; justify-content: center;
align-items: center; color: white; padding: 15px; box-sizing: border-box;
}
​.container {
background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px);
padding: 25px 20px; border-radius: 20px; text-align: center;
width: 100%; max-width: 440px; border: 1px solid rgba(255,255,255,0.1);
box-shadow: 0 15px 35px rgba(0,0,0,0.5);
box-sizing: border-box;
}
​.main-title { color: var(--accent); font-weight: bold; margin-bottom: 15px; font-size: 1.5rem; text-shadow: 0 2px 10px rgba(241, 196, 15, 0.3); }
​.feat-link {
background: none; border: 1px solid var(--accent); color: var(--accent);
padding: 6px 18px; border-radius: 20px; cursor: pointer;
font-size: 0.85rem; margin-bottom: 15px; transition: 0.3s;
display: inline-flex; align-items: center; gap: 5px;
}
.feat-link:hover { background: var(--accent); color: black; }
​.sections-container { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
​.mode-btn {
padding: 10px 5px; border-radius: 12px; border: none; cursor: pointer;
background: #333; color: white; font-weight: bold; font-size: 0.78rem;
transition: 0.3s; text-align: center;
}
.active-mode { background: var(--accent); color: black; box-shadow: 0 0 15px var(--accent); }
​input[type="text"], select {
width: 100%; padding: 14px; border-radius: 12px; border: none;
margin-bottom: 12px; background: white; color: #333;
font-size: 1rem; font-weight: bold; outline: none;
box-sizing: border-box; text-align: right;
}
​.repeat-box {
background: rgba(255,255,255,0.1); padding: 12px; border-radius: 12px;
margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;
}
​.progress-box { margin: 15px 0; display: flex; align-items: center; gap: 12px; font-size: 0.85rem; }
input[type="range"] { flex: 1; cursor: pointer; accent-color: var(--green); }
​.controls { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 10px; }
​.play-btn {
background: var(--green); border: none; width: 75px; height: 75px;
border-radius: 50%; font-size: 1.8rem; cursor: pointer;
display: flex; align-items: center; justify-content: center;
color: black; transition: 0.2s; box-shadow: 0 5px 15px rgba(66, 230, 149, 0.3);
}
.nav-btn, .fav-btn {
background: rgba(255,255,255,0.1); border: none; color: white;
width: 50px; height: 50px; border-radius: 50%; cursor: pointer;
font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
}
.fav-btn { border: 2px solid var(--red); color: var(--red); background: none; }
.fav-btn.active { background: var(--red); color: white; box-shadow: 0 0 15px var(--red); }
​.modal { display: none; position: fixed; z-index: 2000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
.modal-content { background: var(--dark-bg); padding: 25px; border-radius: 20px; width: 100%; max-width: 380px; border: 2px solid var(--accent); position: relative; }
.close-modal { position: absolute; top: 10px; left: 15px; font-size: 1.8rem; cursor: pointer; color: var(--red); }
.feat-list { text-align: right; list-style: none; padding: 0; margin-top: 20px; }
.feat-list li { margin-bottom: 12px; font-size: 0.95rem; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; }
​.footer { margin-top: 25px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 0.8rem; color: var(--accent); }
</style>
</head>
<body>
​<div class="container">
<div class="main-title" id="pageTitle">إذاعة القرآن الكريم</div>
​<button class="feat-link" onclick="toggleModal(true)">📋 أهم المميزات</button>
​<div class="sections-container">
<button class="mode-btn active-mode" id="allMode">📖 المصحف المرتل</button>
<button class="mode-btn" id="mojawadMode">🎤 المصحف المجود</button>
<button class="mode-btn" id="childMode">👶 قسم الأطفال</button>
<button class="mode-btn" id="tafsirMode">📚 مختصر التفسير</button>
</div>
​<!-- قسم القراء العاديين -->
<div id="normalReciterSection">
<input type="text" id="searchReciter" placeholder="🔍 ابحث بأي جزء من الاسم...">
<select id="reciterSelect"></select>
<select id="surahSelect"></select>
</div>
​<!-- قسم التفسير بنظام القائمتين المنفصلتين -->
<div id="tafsirSection" style="display: none;">
<select id="tafsirTypeSelect"></select>
<select id="tafsirMainSurahSelect"></select>
<select id="tafsirPartSelect"></select>
</div>
​<div class="repeat-box">
<label style="font-size: 0.9rem; font-weight: bold;">🔁 تكرار التلاوة آلياً:</label>
<select id="repeatSelect" style="width: auto; margin:0; padding:5px 10px;"></select>
</div>
​<div id="repeatStatus" style="font-size: 0.85rem; color: var(--accent); margin-bottom: 10px; min-height: 1.2em;"></div>
​<div class="progress-box">
<span id="currentTime">0:00</span>
<input type="range" id="seekSlider" value="0" min="0" step="1">
<span id="duration">0:00</span>
</div>
​<div class="controls">
<button id="prevBtn" class="nav-btn">⏭</button>
<button id="addFav" class="fav-btn">❤</button>
<button id="playBtn" class="play-btn">▶</button>
<button id="nextBtn" class="nav-btn">⏮</button>
</div>
​<div class="footer">صدقة جارية لجميع موتى المسلمين</div>
</div>
​<div id="featModal" class="modal">
<div class="modal-content">
<span class="close-modal" onclick="toggleModal(false)">×</span>
<h3 style="color:var(--accent); margin-top: 0;">🌟 مميزات الإذاعة</h3>
<ul class="feat-list">
<li>⭐ تصفح التفسير بنظام القائمتين بدقة متناهية وسلاسة.</li>
<li>⭐ ضبط ترتيب وتصحيح سور القرآن (بما فيها سورة الرحمن وما بعدها).</li>
<li>⭐ استكمال الاستماع تلقائياً من حيث توقفت.</li>
</ul>
</div>
</div>

​function toggleModal(show) { document.getElementById('featModal').style.display = show ? 'flex' : 'none'; }
​for(let i=1; i<=20; i++) {
let opt = document.createElement('option');
opt.value = i; opt.text = i == 1 ? "بدون تكرار" : ${i} مرات;
repeatSelect.appendChild(opt);
}
​function normalizeArabic(text) {
if (!text) return "";
return text.replace(/[أإآء]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[\u064b-\u065f]/g, '');
}
​async function init() {
try {
const res = await fetch("https://www.mp3quran.net/api/v3/reciters?language=ar");
const data = await res.json();
allReciters = data.reciters.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
​const tafsirRes = await fetch("https://www.mp3quran.net/api/v3/tafsir?language=ar");
const tafsirData = await tafsirRes.json();
tafsirList = tafsirData.tafsirs || [];
​buildTafsirTypeDropdown();
buildMainSurahDropdown();
​const lastSave = JSON.parse(localStorage.getItem('lastQuranSession'));
if (lastSave) {
currentMode = lastSave.mode || 'مرتل';
updateActiveBtn(document.getElementById(getModeBtnId(currentMode)));
toggleModeUI();
if (currentMode === 'تفسير') {
tafsirTypeSelect.value = lastSave.server;
tafsirMainSurahSelect.value = lastSave.surahId || 1;
updatePartDropdown(lastSave.surahId || 1);
tafsirPartSelect.value = lastSave.fileCode;
} else {
filterReciters();
loadSurahs(currentMode === 'معلم');
reciterSelect.value = lastSave.server;
surahSelect.value = lastSave.surahNum;
}
audio.src = lastSave.audioUrl || getAudioUrl(lastSave.server, lastSave.surahNum);
audio.load();
audio.currentTime = lastSave.time;
repeatStatus.innerText = "🔄 تم استعادة آخر موقع تلقائياً";
} else {
filterReciters(); loadSurahs(false);
}
} catch(e) {
repeatStatus.innerText = "خطأ في جلب البيانات من السيرفر";
}
}
​function saveCurrentProgress() {
if (!audio.src || audio.paused) return;
let activeServer = (currentMode === 'تفسير') ? tafsirTypeSelect.value : reciterSelect.value;
let activeSurahId = tafsirMainSurahSelect.value;
let activeFileCode = tafsirPartSelect.value;
localStorage.setItem('lastQuranSession', JSON.stringify({
server: activeServer,
surahId: activeSurahId,
fileCode: activeFileCode,
audioUrl: audio.src,
time: audio.currentTime,
mode: currentMode
}));
}
setInterval(saveCurrentProgress, 2000);
​function getModeBtnId(m) {
if (m === 'مجود') return 'mojawadMode';
if (m === 'معلم') return 'childMode';
if (m === 'تفسير') return 'tafsirMode';
return 'allMode';
}
​function playAudioSafe() {
audio.play().catch(() => { repeatStatus.innerText = "تم التجهيز.. اضغط (▶) للمواصلة"; });
}
​function getAudioUrl(server, fileCode) {
let baseUrl = server.endsWith('/') ? server : server + '/';
return ${baseUrl}${fileCode}.mp3;
}
​function buildTafsirTypeDropdown() {
tafsirTypeSelect.innerHTML = '';
​// إضافة خيار الشيخ عبدالله الأسمري - المختصر في التفسير
let asmariOpt = document.createElement('option');
asmariOpt.value = "asmari_drive";
asmariOpt.text = "المختصر في تفسير القرآن الكريم - الشيخ عبدالله الأسمري";
tafsirTypeSelect.appendChild(asmariOpt);
​if (tafsirList.length > 0) {
tafsirList.forEach(t => {
let opt = document.createElement('option');
opt.value = t.server;
opt.text = تفسير القرآن الكريم: ${t.name};
tafsirTypeSelect.appendChild(opt);
});
} else {
let opt = document.createElement('option');
opt.value = "https://server17.mp3quran.net/tafseer/tabri/";
opt.text = "تفسير القرآن الكريم: الطبري";
tafsirTypeSelect.appendChild(opt);
}
}
​function buildMainSurahDropdown() {
tafsirMainSurahSelect.innerHTML = '';
surahNames.forEach((name, index) => {
let sNum = index + 1;
let opt = document.createElement('option');
opt.value = sNum;
opt.text = ${sNum}. سورة ${name};
tafsirMainSurahSelect.appendChild(opt);
});
updatePartDropdown(1);
}
​function updatePartDropdown(surahId) {
tafsirPartSelect.innerHTML = '';
​if (tafsirTypeSelect.value === "asmari_drive") {
let sNum = parseInt(surahId, 10);
let sStr = sNum < 10 ? 00${sNum} : (sNum < 100 ? 0${sNum} : ${sNum});
let opt = document.createElement('option');
opt.value = almokhtasar_fe_tafseer_quran_${sStr};
opt.text = سورة ${surahNames[sNum-1]} كاملة (الشيخ عبد الله الأسمري);
tafsirPartSelect.appendChild(opt);
return;
}
​let parts = tafsirDatabase[surahId];
​if (!parts) {
let sNum = parseInt(surahId, 10);
let sStr = sNum < 10 ? 00${sNum} : (sNum < 100 ? 0${sNum} : ${sNum});
parts = [{ name: سورة ${surahNames[sNum-1]} كاملة, file: sStr }];
}
​parts.forEach(p => {
let opt = document.createElement('option');
opt.value = p.file;
opt.text = p.name;
tafsirPartSelect.appendChild(opt);
});
}
​function playTafsirAudio() {
if (!tafsirTypeSelect.value || !tafsirPartSelect.value) return;
​if (tafsirTypeSelect.value === "asmari_drive") {
// ضع هنا رابط الاستضافة أو السيرفر المباشر لملفات الشيخ عبدالله الأسمري
let baseUrl = "https://your-server-or-drive-link-here/";
baseUrl = baseUrl.endsWith('/') ? baseUrl : baseUrl + '/';
audio.src = ${baseUrl}${tafsirPartSelect.value}.mp3;
} else {
audio.src = getAudioUrl(tafsirTypeSelect.value, tafsirPartSelect.value);
}
​currentRepeat = 1;
updateStatus();
audio.load();
playAudioSafe();
}
​function autoPlayTrack() {
if(!reciterSelect.value || !surahSelect.value) return;
audio.src = getAudioUrl(reciterSelect.value, surahSelect.value);
currentRepeat = 1;
updateStatus();
checkFavStatus();
audio.load();
playAudioSafe();
}
​function filterReciters(term = "") {
reciterSelect.innerHTML = '<option value="">-- اختر القارئ --</option>';
const cleanTerm = normalizeArabic(term.trim());
​if (term === "") {
let favGroup = document.createElement('optgroup');
favGroup.label = "⭐ القراء المفضلون";
favorites.filter(f => f.mode === currentMode).forEach(f => {
let opt = document.createElement('option');
opt.value = f.server;
opt.text = "❤️ " + f.name;
favGroup.appendChild(opt);
});
if(favGroup.children.length > 0) reciterSelect.appendChild(favGroup);
}
​let allGroup = document.createElement('optgroup');
allGroup.label = term === "" ? "📋 القائمة الأبجدية" : "🔍 نتائج البحث";
​allReciters.forEach(r => {
const cleanName = normalizeArabic(r.name);
if (cleanTerm === "" || cleanName.includes(cleanTerm)) {
let found = r.moshaf.find(m => {
if (currentMode === 'معلم') return m.name.includes("معلم");
if (currentMode === 'مجود') return m.name.includes("مجود");
return m.name.includes("مرتل") || m.name.includes("حفص");
});
if(found) {
const opt = document.createElement('option');
opt.value = found.server;
opt.text = r.name;
allGroup.appendChild(opt);
}
}
});
reciterSelect.appendChild(allGroup);
}
​function loadSurahs(isAmma) {
const prev = surahSelect.value;
surahSelect.innerHTML = '';
surahNames.forEach((n, i) => {
if(!isAmma || i >= 77 || i === 0) {
const opt = document.createElement('option');
opt.value = (i+1).toString().padStart(3, '0');
opt.text = ${i+1}. سورة ${n};
surahSelect.appendChild(opt);
}
});
if(prev && !isAmma) surahSelect.value = prev;
}
​playBtn.onclick = () => {
if(!audio.src) {
if(currentMode === 'تفسير') {
playTafsirAudio();
} else {
autoPlayTrack();
}
} else {
audio.paused ? playAudioSafe() : audio.pause();
}
};
​document.getElementById('nextBtn').onclick = () => {
if (currentMode === 'تفسير') {
if (tafsirPartSelect.selectedIndex < tafsirPartSelect.options.length - 1) {
tafsirPartSelect.selectedIndex++;
} else if (tafsirMainSurahSelect.selectedIndex < tafsirMainSurahSelect.options.length - 1) {
tafsirMainSurahSelect.selectedIndex++;
updatePartDropdown(tafsirMainSurahSelect.value);
tafsirPartSelect.selectedIndex = 0;
} else {
tafsirMainSurahSelect.selectedIndex = 0;
updatePartDropdown(tafsirMainSurahSelect.value);
tafsirPartSelect.selectedIndex = 0;
}
playTafsirAudio();
} else {
if(surahSelect.selectedIndex === surahSelect.options.length - 1) {
if(reciterSelect.selectedIndex < reciterSelect.options.length - 1) {
reciterSelect.selectedIndex++; surahSelect.selectedIndex = 0; autoPlayTrack();
}
} else { surahSelect.selectedIndex++; autoPlayTrack(); }
}
};
​document.getElementById('prevBtn').onclick = () => {
if (currentMode === 'تفسير') {
if (tafsirPartSelect.selectedIndex > 0) {
tafsirPartSelect.selectedIndex--;
} else if (tafsirMainSurahSelect.selectedIndex > 0) {
tafsirMainSurahSelect.selectedIndex--;
updatePartDropdown(tafsirMainSurahSelect.value);
tafsirPartSelect.selectedIndex = tafsirPartSelect.options.length - 1;
} else {
tafsirMainSurahSelect.selectedIndex = tafsirMainSurahSelect.options.length - 1;
updatePartDropdown(tafsirMainSurahSelect.value);
tafsirPartSelect.selectedIndex = tafsirPartSelect.options.length - 1;
}
playTafsirAudio();
} else {
if(surahSelect.selectedIndex > 0) { surahSelect.selectedIndex--; autoPlayTrack(); }
}
};
​function updateStatus() {
let max = parseInt(repeatSelect.value);
repeatStatus.innerText = max > 1 ? تكرار: ${currentRepeat} من ${max} : "جاري الاستماع الآن...";
}
​audio.onplay = () => playBtn.innerText = "⏸";
audio.onpause = () => playBtn.innerText = "▶";
audio.onerror = () => { repeatStatus.innerText = "⚠️ تعذر جلب الملف الصوتي"; };
​audio.onended = () => {
let max = parseInt(repeatSelect.value);
if (currentRepeat < max) { currentRepeat++; updateStatus(); audio.currentTime = 0; playAudioSafe(); }
else { document.getElementById('nextBtn').click(); }
};
​audio.ontimeupdate = () => {
if(!isNaN(audio.duration)) {
seekSlider.value = (audio.currentTime/audio.duration)*100;
document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
document.getElementById('duration').innerText = formatTime(audio.duration);
}
};
​seekSlider.oninput = () => audio.currentTime = audio.duration * (seekSlider.value/100);
function formatTime(s) { let m=Math.floor(s/60), sc=Math.floor(s%60); return ${m}:${sc<10?'0'+sc:sc}; }
​favBtn.onclick = () => {
if (currentMode === 'تفسير') return;
const server = reciterSelect.value; if(!server) return;
let name = reciterSelect.options[reciterSelect.selectedIndex].text.replace("❤️ ", "");
const idx = favorites.findIndex(f => f.server === server);
if(idx === -1) favorites.push({server, name, mode: currentMode}); else favorites.splice(idx, 1);
localStorage.setItem('quranFavs', JSON.stringify(favorites));
filterReciters(document.getElementById('searchReciter').value);
reciterSelect.value = server; checkFavStatus();
};
​function checkFavStatus() {
if (currentMode === 'تفسير') { favBtn.classList.remove('active'); return; }
const exists = favorites.some(f => f.server === reciterSelect.value);
favBtn.classList.toggle('active', exists);
}
​reciterSelect.onchange = autoPlayTrack;
surahSelect.onchange = autoPlayTrack;
​tafsirMainSurahSelect.onchange = () => {
updatePartDropdown(tafsirMainSurahSelect.value);
playTafsirAudio();
};
​tafsirPartSelect.onchange = playTafsirAudio;
tafsirTypeSelect.onchange = () => {
updatePartDropdown(tafsirMainSurahSelect.value);
if(audio.src) playTafsirAudio();
};
​document.getElementById('searchReciter').oninput = (e) => filterReciters(e.target.value);
​function updateActiveBtn(btn) { document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active-mode')); btn.classList.add('active-mode'); }
​function toggleModeUI() {
const isTafsir = (currentMode === 'تفسير');
document.getElementById('normalReciterSection').style.display = isTafsir ? 'none' : 'block';
document.getElementById('tafsirSection').style.display = isTafsir ? 'block' : 'none';
document.getElementById('pageTitle').innerText = isTafsir ? "تفسير القرآن الكريم" : "إذاعة القرآن الكريم";
favBtn.style.display = isTafsir ? 'none' : 'flex';
}
​const modes = { 'allMode': 'مرتل', 'mojawadMode': 'مجود', 'childMode': 'معلم', 'tafsirMode': 'تفسير' };
Object.keys(modes).forEach(id => {
document.getElementById(id).onclick = function() {
currentMode = modes[id];
updateActiveBtn(this);
toggleModeUI();
​if (currentMode === 'تفسير') {
playTafsirAudio();
} else {
loadSurahs(currentMode === 'معلم');
filterReciters();
audio.pause();
playBtn.innerText = "▶";
}
};
});
​init();
</script>
