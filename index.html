<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إذاعة القرآن الكريم - نسخة الأندرويد</title>
    <style>
        :root { --accent: #f1c40f; --green: #42e695; --red: #ff4757; --bg-dark: rgba(0, 0, 0, 0.9); }
        body {
            margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh; display: flex; justify-content: center; 
            align-items: center; color: white; padding: 15px; box-sizing: border-box;
        }
        .container {
            background: var(--bg-dark); backdrop-filter: blur(15px);
            padding: 25px; border-radius: 25px; text-align: center;
            width: 100%; max-width: 450px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .main-title { color: var(--accent); font-weight: bold; margin-bottom: 20px; font-size: 1.6rem; }
        .mode-btn { padding: 12px; border-radius: 12px; border: none; cursor: pointer; background: #333; color: white; font-weight: bold; font-size: 0.85rem; transition: 0.3s; width: 48%; margin-bottom: 5px; }
        .active-mode { background: var(--accent); color: black; }
        input[type="text"], select { width: 100%; padding: 14px; border-radius: 12px; border: none; margin-bottom: 12px; font-weight: bold; background: white; color: #333; font-size: 1rem; }
        .controls { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 20px; }
        .play-btn { background: var(--green); border: none; width: 75px; height: 75px; border-radius: 50%; font-size: 2rem; cursor: pointer; color: black; }
        .nav-btn { background: rgba(255,255,255,0.1); border: none; color: white; width: 50px; height: 50px; border-radius: 50%; font-size: 1.4rem; cursor: pointer; }
        .progress-box { margin: 20px 0; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
        input[type="range"] { flex: 1; accent-color: var(--green); }
        .status-text { color: var(--green); font-size: 0.85rem; height: 20px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-title">إذاعة القرآن الكريم</div>
    
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; margin-bottom: 15px;">
        <button class="mode-btn active-mode" id="allMode">📖 المرتل</button>
        <button class="mode-btn" id="mojawadMode">🎤 المجود</button>
        <button class="mode-btn" style="width: 100%" id="childMode">👶 المصحف المعلم</button>
    </div>

    <input type="text" id="searchReciter" placeholder="🔍 ابحث عن قارئ...">
    <select id="reciterSelect"></select>
    <select id="surahSelect"></select>

    <div class="status-text" id="statusMsg">جاهز للاستماع</div>

    <div class="progress-box">
        <span id="currentTime">0:00</span>
        <input type="range" id="seekSlider" value="0">
        <span id="duration">0:00</span>
    </div>

    <div class="controls">
        <button id="prevBtn" class="nav-btn">⏭</button>
        <button id="playBtn" class="play-btn">▶</button>
        <button id="nextBtn" class="nav-btn">⏮</button>
    </div>
</div>

<audio id="audioPlayer" preload="auto"></audio>

<script>
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const reciterSelect = document.getElementById('reciterSelect');
    const surahSelect = document.getElementById('surahSelect');
    const statusMsg = document.getElementById('statusMsg');
    const seekSlider = document.getElementById('seekSlider');

    let allReciters = [];
    let currentMode = 'مرتل';

    const surahNames = ["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];

    async function init() {
        try {
            const res = await fetch("https://mp3quran.net/api/v3/reciters?language=ar");
            const data = await res.json();
            allReciters = data.reciters;
            fillReciters();
            fillSurahs();
        } catch(e) { statusMsg.innerText = "خطأ في تحميل البيانات"; }
    }

    function fillReciters() {
        reciterSelect.innerHTML = '<option value="">-- اختر القارئ --</option>';
        allReciters.forEach(r => {
            let found = r.moshaf.find(m => currentMode === 'معلم' ? m.name.includes("معلم") : (currentMode === 'مجود' ? m.name.includes("مجود") : m.name.includes("مرتل")));
            if(found) {
                let opt = document.createElement('option');
                opt.value = found.server;
                opt.text = r.name;
                reciterSelect.appendChild(opt);
            }
        });
    }

    function fillSurahs() {
        surahSelect.innerHTML = '';
        surahNames.forEach((name, i) => {
            let opt = document.createElement('option');
            opt.value = (i+1).toString().padStart(3, '0');
            opt.text = name;
            surahSelect.appendChild(opt);
        });
    }

    // الحل الجوهري للأندرويد: وظيفة تشغيل قوية
    function forcePlay() {
        if(!reciterSelect.value) return;
        statusMsg.innerText = "جاري التحميل...";
        audio.src = `${reciterSelect.value}${surahSelect.value}.mp3`;
        
        // استخدام Promise للتشغيل لضمان تجاوز قيود المتصفح
        audio.load();
        let playPromise = audio.play();

        if (playPromise !== undefined) {
            playPromise.then(_ => {
                statusMsg.innerText = "جاري الاستماع: " + surahSelect.options[surahSelect.selectedIndex].text;
            }).catch(error => {
                statusMsg.innerText = "اضغط ▶ للبدء";
                console.log("Autoplay blocked");
            });
        }
    }

    audio.onended = () => {
        if(surahSelect.selectedIndex < surahSelect.options.length - 1) {
            surahSelect.selectedIndex++;
            forcePlay(); // الانتقال التلقائي
        }
    };

    playBtn.onclick = () => {
        if(!audio.src) forcePlay();
        else audio.paused ? audio.play() : audio.pause();
    };

    reciterSelect.onchange = forcePlay;
    surahSelect.onchange = forcePlay;

    document.getElementById('nextBtn').onclick = () => {
        if(surahSelect.selectedIndex < surahSelect.options.length - 1) {
            surahSelect.selectedIndex++;
            forcePlay();
        }
    };

    document.getElementById('prevBtn').onclick = () => {
        if(surahSelect.selectedIndex > 0) {
            surahSelect.selectedIndex--;
            forcePlay();
        }
    };

    audio.onplay = () => playBtn.innerText = "⏸";
    audio.onpause = () => playBtn.innerText = "▶";
    audio.ontimeupdate = () => {
        if(!isNaN(audio.duration)) {
            seekSlider.value = (audio.currentTime / audio.duration) * 100;
            document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
            document.getElementById('duration').innerText = formatTime(audio.duration);
        }
    };
    seekSlider.oninput = () => audio.currentTime = audio.duration * (seekSlider.value / 100);
    function formatTime(s) { let m=Math.floor(s/60), sc=Math.floor(s%60); return `${m}:${sc<10?'0'+sc:sc}`; }

    init();
</script>
</body>
</html>
