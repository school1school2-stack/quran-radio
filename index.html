<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصحف أبو نواف - ركن أطفال داوود</title>
    <style>
        :root { --accent: #f1c40f; --green: #42e695; }
        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e; min-height: 100vh;
            display: flex; justify-content: center; align-items: center; color: white; padding: 20px;
        }
        .container {
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 20px; text-align: center;
            width: 100%; max-width: 500px; border: 2px solid var(--accent);
        }
        .video-box {
            position: relative; width: 100%; padding-bottom: 56.25%;
            height: 0; border-radius: 15px; overflow: hidden; margin-bottom: 20px;
            background: #000; border: 1px solid #333;
        }
        .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        select {
            width: 100%; padding: 12px; border-radius: 10px; border: none;
            margin-bottom: 15px; font-weight: bold; background: #fff; color: #333;
        }
        .mode-title { color: var(--accent); margin-bottom: 10px; font-weight: bold; }
        .footer { margin-top: 15px; font-size: 0.8rem; opacity: 0.7; }
    </style>
</head>
<body>

<div class="container">
    <div style="color:var(--green); font-weight:bold; margin-bottom:10px;">إشراف أبو نواف</div>
    <div class="mode-title">📺 قناة داوود للأطفال - اختر السورة</div>

    <div class="video-box">
        <iframe id="dawoodFrame" src="https://www.youtube.com/embed/Uf0S7FcfXOI" allowfullscreen></iframe>
    </div>

    <label for="dawoodSurah">اختر السورة لتعلمها مع داوود:</label>
    <select id="dawoodSurah" onchange="changeDawoodVideo()">
        <option value="Uf0S7FcfXOI">سورة النبأ</option>
        <option value="W_X_7m6Y0vE">سورة النازعات</option>
        <option value="6M5y1_v_L8A">سورة عبس</option>
        <option value="p7NfP8XGZ-g">سورة التكوير</option>
        <option value="mKInYFzG32U">سورة الانفطار</option>
        <option value="exfH6-Cj_68">سورة المطففين</option>
        <option value="R08S5vG80p8">سورة الشمس</option>
        <option value="YfV7-h7fV_M">سورة الناس</option>
        <option value="lzEuix0DYhY">مشاهدة القناة كاملة</option>
    </select>

    <div class="footer">تعليم القرآن للأطفال بأسلوب ممتع - 2026</div>
</div>

<script>
    function changeDawoodVideo() {
        const select = document.getElementById('dawoodSurah');
        const iframe = document.getElementById('dawoodFrame');
        const videoId = select.value;
        
        // تحديث الرابط ليعمل الفيديو الجديد فوراً داخل الموقع
        iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
    }
</script>

</body>
</html>
