<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصحف أبو نواف الجامع - مع المفضلة</title>
    <style>
        :root { --accent: #f1c40f; --green: #42e695; --red: #ff4757; }
        
        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: cover; background-attachment: fixed;
            min-height: 100vh; display: flex; justify-content: center; 
            align-items: center; color: white; padding: 20px;
            transition: background 0.5s ease;
        }

        .container {
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px);
            padding: 25px; border-radius: 25px; text-align: center;
            width: 100%; max-width: 450px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .owner { color: var(--green); font-weight: bold; margin-bottom: 15px; font-size: 1.2rem; }

        .bg-selector { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
        .bg-opt { width: 25px; height: 25px; border-radius: 50%; border: 2px solid white; cursor: pointer; }

        select, input[type="text"] {
            width: 100%; padding: 12px; border-radius: 10px; border: none;
            margin-bottom: 10px; font-weight: bold; outline: none; box-sizing: border-box;
        }

        .progress-container { margin: 15px 0; display: flex; align-items: center; gap: 10px; font-size: 0.8rem; }
        input[type="range"] { flex: 1; cursor: pointer; accent-color: var(--green); }

        .controls-row { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 10px; }
        
        .play-btn {
            background: var(--green); border: none; width: 60px; height: 60px;
            border-radius: 50%; font-size: 1.5rem; cursor: pointer; transition: 0.3s;
        }
        .fav-btn {
            background: none; border: 2px solid var(--red); color: var(--red);
            width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; transition: 0.3s;
        }
        .fav-btn.active { background: var(--red); color: white; }

        /* قسم المفضلة */
        .favorites-list {
            margin-top: 25px; text-align: right; background: rgba(255,255,255,0.05);
            border-radius: 15px; padding: 10px; max-height: 150px; overflow-y: auto;
        }
        .fav-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.85rem;
        }
        .fav-item:last-child { border: none; }
        .fav-item span { cursor: pointer; flex: 1; }
        .del-fav { color: var(--red); cursor: pointer; margin-right: 10px; font-weight: bold; }

        .mode-btn { padding: 6px 12px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.75rem; background: #444; color: white; }
        .active-mode { background: var(--accent); color: black; font-weight: bold; }
        .footer { margin-top: 20px; font-size: 0.7rem; opacity: 0.5; }
    </style>
</head>
<body id="mainBody">

<div class="container">
    <div class="owner">مصحف أبو نواف</div>

    <div class="bg-selector">
        <div class="bg-opt" onclick="changeBg('linear-gradient(135deg, #1e3c72, #2a5298)')" style="background: #1e3c72;"></div>
        <div class="bg-opt" onclick="changeBg('linear-gradient(135deg, #134e5e, #71b280)')" style="background: #134e5e;"></div>
        <div class="bg-opt" onclick="changeBg('linear-gradient(135deg, #2c3e50, #000000)')" style="background: #2c3e50;"></div>
        <div class="bg-opt" onclick="changeBg('linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d)')" style="background: linear-gradient(135deg, #1a2a6c, #fdbb2d);"></div>
    </div>
    
    <div style="margin-bottom: 15px;">
        <button class="mode-btn active-mode" id="allMode">المصحف كامل</button>
        <button class="mode-btn" id="ammaMode">جزء عم</button>
    </div>

    <input type="text" id="searchReciter" placeholder="ابحث عن القارئ...">
    <select id="reciterSelect"><option>جاري التحميل...</option></select>
    <select id="surahSelect"></select>

    <div class="progress-container">
        <span id="currentTime">0:00</span>
        <input type="range" id="seekSlider" value="0">
        <span id="duration">0:00</span>
    </div>

    <div class="controls-row">
        <button id="favBtn" class="fav-btn" title="إضافة للمفضلة">❤️</button>
        <button id="playBtn" class="play-btn">▶</button>
    </div>

    <div class="favorites-list" id="favoritesList">
        <div style="text-align: center; font-size: 0.8rem; color: var(--accent);">قائمة المفضلة</div>
        <div id="favItemsContainer"></div>
    </div>

    <div class="footer">حقوق النشر محفوظة - أبو نواف © 2026</div>
</div>

<audio id="audioPlayer"></audio>

<script>
    const body = document.getElementById('mainBody');
    const reciterSelect = document.getElementById('reciterSelect');
    const surahSelect = document.getElementById('surahSelect');
    const playBtn = document.getElementById('playBtn');
    const favBtn = document.getElementById('favBtn');
    const favItemsContainer = document.getElementById('favItemsContainer');
    const audio = document.getElementById('audioPlayer');
    const seekSlider = document.getElementById('seekSlider');

    let allReciters = [];
    let favorites = JSON.parse(localStorage.getItem('quranFavs')) || [];
    const surahNames = ["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];

    function changeBg(bg) { body.style.background = bg; body.style.backgroundSize = "cover"; localStorage.setItem('quranBg', bg); }
    if(localStorage.getItem('quranBg')) changeBg(localStorage.getItem('quranBg'));

    async function init() {
        const res = await fetch("https://mp3quran.net/api/v3/reciters?language=ar");
        const data = await res.json();
        allReciters = data.reciters;
        populateReciters(allReciters);
        loadSurahs(false);
        renderFavorites();
    }

    function populateReciters(list) {
        reciterSelect.innerHTML = '<option value="">-- اختر القارئ --</option>';
        list.forEach(r => {
            if(r.moshaf && r.moshaf.length > 0) {
                const option = document.createElement('option');
                option.value = r.moshaf[0].server;
                option.text = r.name;
                reciterSelect.appendChild(option);
            }
        });
    }

    function loadSurahs(isAmmaOnly) {
        surahSelect.innerHTML = '';
        const start = isAmmaOnly ? 77 : 0;
        surahNames.forEach((name, index) => {
            if (index >= start || index === 0) {
                const option = document.createElement('option');
                option.value = (index + 1).toString().padStart(3, '0');
                option.text = name;
                surahSelect.appendChild(option);
            }
        });
    }

    // إدارة المفضلة
    favBtn.onclick = () => {
        const server = reciterSelect.value;
        const surahIdx = surahSelect.value;
        if(!server || !surahIdx) return;
        
        const favItem = {
            name: `${reciterSelect.options[reciterSelect.selectedIndex].text} - ${surahSelect.options[surahSelect.selectedIndex].text}`,
            server: server,
            surah: surahIdx
        };

        if(!favorites.some(f => f.name === favItem.name)) {
            favorites.push(favItem);
            localStorage.setItem('quranFavs', JSON.stringify(favorites));
            renderFavorites();
        }
    };

    function renderFavorites() {
        favItemsContainer.innerHTML = favorites.length ? '' : '<div style="font-size:0.7rem; color:#888; text-align:center;">لا يوجد مفضلة بعد</div>';
        favorites.forEach((fav, index) => {
            const div = document.createElement('div');
            div.className = 'fav-item';
            div.innerHTML = `<span onclick="playFav(${index})">${fav.name}</span><div class="del-fav" onclick="deleteFav(${index})">×</div>`;
            favItemsContainer.appendChild(div);
        });
    }

    window.playFav = (index) => {
        const fav = favorites[index];
        reciterSelect.value = fav.server;
        surahSelect.value = fav.surah;
        playBtn.click();
    };

    window.deleteFav = (index) => {
        favorites.splice(index, 1);
        localStorage.setItem('quranFavs', JSON.stringify(favorites));
        renderFavorites();
    };

    // تشغيل وتحكم
    audio.ontimeupdate = () => {
        if (!isNaN(audio.duration)) {
            seekSlider.value = (audio.currentTime / audio.duration) * 100;
            document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
            document.getElementById('duration').innerText = formatTime(audio.duration);
        }
    };
    seekSlider.oninput = () => audio.currentTime = audio.duration * (seekSlider.value / 100);
    function formatTime(s) { let m = Math.floor(s/60), sec = Math.floor(s%60); return `${m}:${sec<10?'0'+sec:sec}`; }

    playBtn.onclick = () => {
        const url = `${reciterSelect.value}${surahSelect.value}.mp3`;
        if (audio.src !== url) { audio.src = url; audio.play(); playBtn.innerText = "⏸"; }
        else { audio.paused ? (audio.play(), playBtn.innerText = "⏸") : (audio.pause(), playBtn.innerText = "▶"); }
    };

    document.getElementById('searchReciter').oninput = (e) => populateReciters(allReciters.filter(r => r.name.includes(e.target.value)));
    document.getElementById('ammaMode').onclick = () => loadSurahs(true);
    document.getElementById('allMode').onclick = () => loadSurahs(false);

    init();
</script>
</body>
</html>
