<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إذاعة القرآن الكريم - أبو نواف</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .radio-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 380px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .header-title { color: #f1c40f; margin-bottom: 5px; font-size: 1.6rem; }
        .sub-title { color: #42e695; margin-bottom: 25px; font-weight: bold; }

        /* خانة البحث */
        .search-box {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            margin-bottom: 15px;
            outline: none;
            font-size: 1rem;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.9);
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background: #fff;
            color: #333;
            font-weight: bold;
            border: none;
            margin-bottom: 25px;
            cursor: pointer;
            outline: none;
            height: 45px;
        }

        .play-btn {
            background: #42e695;
            color: #000;
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            box-shadow: 0 0 20px rgba(66, 230, 149, 0.4);
        }

        .play-btn:hover { transform: scale(1.1); }

        .footer-name { margin-top: 25px; font-size: 0.8rem; color: #bdc3c7; }

        .waves {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 30px;
            gap: 4px;
            margin-top: 20px;
            opacity: 0;
        }
        .waves.active { opacity: 1; }
        .wave-bar {
            width: 4px;
            background: #42e695;
            border-radius: 2px;
            animation: pulse 1s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { height: 10px; } 50% { height: 30px; } }
    </style>
</head>
<body>

<div class="radio-card">
    <div class="header-title">إذاعة القرآن الكريم</div>
    <div class="sub-title">إهداء من أبو نواف</div>

    <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن قارئ أو إذاعة...">

    <select id="radioStations">
        <option value="">-- جاري تحميل الإذاعات --</option>
    </select>

    <button class="play-btn" id="mainBtn">▶</button>

    <div class="waves" id="waveContainer">
        <div class="wave-bar" style="animation-delay: 0.1s"></div>
        <div class="wave-bar" style="animation-delay: 0.3s"></div>
        <div class="wave-bar" style="animation-delay: 0.5s"></div>
        <div class="wave-bar" style="animation-delay: 0.2s"></div>
        <div class="wave-bar" style="animation-delay: 0.4s"></div>
    </div>

    <div class="footer-name">بواسطة أبو نواف © 2026</div>
</div>

<audio id="player"></audio>

<script>
    const player = document.getElementById('player');
    const select = document.getElementById('radioStations');
    const btn = document.getElementById('mainBtn');
    const waves = document.getElementById('waveContainer');
    const searchInput = document.getElementById('searchInput');
    
    let allStations = []; // لتخزين جميع الإذاعات للبحث فيها

    // جلب البيانات من الـ API
    async function loadRadios() {
        try {
            const response = await fetch("https://mp3quran.net/api/v3/radios?language=ar");
            const data = await response.json();
            allStations = data.radios;
            displayStations(allStations);
        } catch (error) {
            select.innerHTML = '<option>تعذر تحميل البيانات</option>';
        }
    }

    // وظيفة لعرض الإذاعات في القائمة
    function displayStations(stations) {
        select.innerHTML = '<option value="">-- اختر الإذاعة --</option>';
        stations.forEach(radio => {
            let option = document.createElement('option');
            option.value = radio.url;
            option.text = radio.name;
            select.appendChild(option);
        });
    }

    // وظيفة البحث
    searchInput.oninput = () => {
        const searchTerm = searchInput.value.toLowerCase();
        const filtered = allStations.filter(radio => 
            radio.name.toLowerCase().includes(searchTerm)
        );
        displayStations(filtered);
    };

    btn.onclick = () => {
        if (!select.value) return alert("اختر إذاعة أولاً");

        if (player.paused) {
            player.src = select.value;
            player.play();
            btn.innerText = "⏸";
            waves.classList.add('active');
        } else {
            player.pause();
            btn.innerText = "▶";
            waves.classList.remove('active');
        }
    };

    loadRadios();
</script>

</body>
</html>
