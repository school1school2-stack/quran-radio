<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصحف أبو نواف الجامع</title>
    <style>
        :root {
            --bg-image: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
            transition: background 0.5s ease;
        }

        .container {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .header-section h2 { color: #f1c40f; margin: 0; font-size: 1.8rem; }
        .owner { color: #42e695; margin-bottom: 20px; font-weight: bold; letter-spacing: 1px; }

        .search-box {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            margin-bottom: 15px;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            border: 2px solid transparent;
        }

        /* تنسيق أزرار الخلفيات */
        .bg-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .bg-opt {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid white;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .bg-opt:hover { transform: scale(1.2); }

        .play-btn {
            background: #42e695;
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(66, 230, 149, 0.4);
            transition: 0.3s;
        }

        .play-btn:hover { background: #34d082; transform: scale(1.05); }

        .footer { margin-top: 25px; font-size: 0.85rem; opacity: 0.8; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
    </style>
</head>
<body id="bodyBg">

<div class="container">
    <div class="header-section">
        <h2>القرآن الكريم</h2>
        <div class="owner">بإشراف أبو نواف</div>
    </div>

    <div class="bg-selector">
        <div class="bg-opt" onclick="changeBg('linear-gradient(135deg, #1e3c72, #2a5298)')" style="background: #1e3c72;" title="أزرق ليلي"></div>
        <div class="bg-opt" onclick="changeBg('linear-gradient(135deg, #134e5e, #71b280)')" style="background: #134e5e;" title="أخضر هادئ"></div>
        <div class="bg-opt" onclick="changeBg('linear-gradient(135deg, #2c3e50, #000000)')" style="background: #2c3e50;" title="أسود فخم"></div>
        <div class="bg-opt" onclick="changeBg('url(\'https://images.unsplash.com/photo-1590075865003-e48277adc4e8?q=80&w=1000\')')" style="background: url('https://images.unsplash.com/photo-1590075865003-e48277adc4e8?q=10&w=50'); background-size: cover;" title="خلفية مساجد"></div>
        <div class="bg-opt" onclick="changeBg('linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d)')" style="background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);" title="الخلفية الأصلية"></div>
    </div>

    <input type="text" id="searchReciter" class="search-box" placeholder="ابحث عن اسم القارئ...">
    
    <select id="reciterSelect">
        <option value="">-- اختر القارئ --</option>
    </select>

    <select id="surahSelect">
        <option value="">-- اختر السورة --</option>
    </select>

    <div class="controls">
        <button id="playBtn" class="play-btn">▶</button>
    </div>

    <div class="footer">جميع الحقوق محفوظة - أبو نواف © 2026</div>
</div>

<audio id="audioPlayer"></audio>

<script>
    const reciterSelect = document.getElementById('reciterSelect');
    const surahSelect = document.getElementById('surahSelect');
    const searchInput = document.getElementById('searchReciter');
    const playBtn = document.getElementById('playBtn');
    const audio = document.getElementById('audioPlayer');
    const bodyBg = document.getElementById('bodyBg');

    let allReciters = [];

    // وظيفة تغيير الخلفية
    function changeBg(bg) {
        bodyBg.style.background = bg;
        bodyBg.style.backgroundSize = "cover";
        localStorage.setItem('userBg', bg); // حفظ الاختيار
    }

    // استعادة الخلفية المحفوظة
    if(localStorage.getItem('userBg')) {
        changeBg(localStorage.getItem('userBg'));
    }

    async function init() {
        try {
            const res = await fetch("https://mp3quran.net/api/v3/reciters?language=ar");
            const data = await res.json();
            allReciters = data.reciters;
            populateReciters(allReciters);
            loadSurahs();
        } catch (e) { console.log("Error loading reciters"); }
    }

    function populateReciters(list) {
        reciterSelect.innerHTML = '<option value="">-- اختر القارئ --</option>';
        list.forEach(r => {
            if(r.moshaf && r.moshaf.length > 0) {
                const option = document.createElement('option');
                option.value = r.moshaf[0].server;
                option.text = r.name;
                reciterSelect.appendChild(option);
            }
        });
    }

    function loadSurahs() {
        const surahNames = ["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
        surahNames.forEach((name, index) => {
            const option = document.createElement('option');
            option.value = (index + 1).toString().padStart(3, '0');
            option.text = `${index + 1}. ${name}`;
            surahSelect.appendChild(option);
        });
    }

    searchInput.oninput = () => {
        const filtered = allReciters.filter(r => r.name.includes(searchInput.value));
        populateReciters(filtered);
    };

    playBtn.onclick = () => {
        const server = reciterSelect.value;
        const surah = surahSelect.value;
        if (!server || !surah) return alert("اختر القارئ والسورة");
        const finalUrl = `${server}${surah}.mp3`;
        if (audio.src !== finalUrl) {
            audio.src = finalUrl;
            audio.play();
            playBtn.innerText = "⏸";
        } else {
            if (audio.paused) { audio.play(); playBtn.innerText = "⏸"; }
            else { audio.pause(); playBtn.innerText = "▶"; }
        }
    };

    init();
</script>

</body>
</html>
