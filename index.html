<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصحف أبو نواف - تعليم الأطفال</title>
    <style>
        :root { --accent: #f1c40f; --child-bg: #4facfe; }
        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: cover; min-height: 100vh;
            display: flex; justify-content: center; align-items: center; color: white; padding: 20px;
        }
        .container {
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(15px);
            padding: 25px; border-radius: 25px; text-align: center;
            width: 100%; max-width: 450px; border: 1px solid rgba(255,255,255,0.2);
        }
        .header h2 { color: var(--accent); margin: 0; }
        .owner { color: #42e695; font-size: 0.9rem; margin-bottom: 15px; }
        
        /* قسم جزء عم للأطفال */
        .kids-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px; padding: 15px; margin-bottom: 20px;
            border: 1px dashed var(--accent);
        }
        .kids-section h3 { margin: 0 0 10px 0; font-size: 1rem; color: #4facfe; }

        select, input {
            width: 100%; padding: 12px; border-radius: 10px; border: none;
            margin-bottom: 10px; font-weight: bold; outline: none;
        }
        .play-btn {
            background: #42e695; border: none; width: 65px; height: 65px;
            border-radius: 50%; font-size: 1.5rem; cursor: pointer; transition: 0.3s;
        }
        .play-btn:hover { transform: scale(1.1); }
        .footer { margin-top: 20px; font-size: 0.7rem; opacity: 0.6; }
        
        .btn-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .mode-btn { 
            flex: 1; padding: 8px; border-radius: 8px; border: none; 
            cursor: pointer; font-weight: bold; background: #555; color: white;
        }
        .active-mode { background: var(--accent); color: black; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>مصحف أبو نواف</h2>
        <div class="owner">تعليم الناشئة والقرآن الكريم</div>
    </div>

    <div class="kids-section">
        <h3>👶 ركن الطفل (جزء عم)</h3>
        <div class="btn-group">
            <button class="mode-btn active-mode" id="allMode">المصحف كامل</button>
            <button class="mode-btn" id="ammaMode">جزء عم فقط</button>
        </div>
        <p id="modeDesc" style="font-size: 0.8rem; color: #ccc;">تصفح المصحف كاملاً</p>
    </div>

    <input type="text" id="searchReciter" placeholder="ابحث عن القارئ...">
    <select id="reciterSelect"><option>جاري التحميل...</option></select>
    <select id="surahSelect"></select>

    <button id="playBtn" class="play-btn">▶</button>

    <div class="footer">إعداد وإشراف أبو نواف © 2026</div>
</div>

<audio id="audioPlayer"></audio>

<script>
    const reciterSelect = document.getElementById('reciterSelect');
    const surahSelect = document.getElementById('surahSelect');
    const searchInput = document.getElementById('searchReciter');
    const playBtn = document.getElementById('playBtn');
    const audio = document.getElementById('audioPlayer');
    const ammaBtn = document.getElementById('ammaMode');
    const allBtn = document.getElementById('allMode');
    const modeDesc = document.getElementById('modeDesc');

    let allReciters = [];
    const surahNames = ["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغان","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];

    async function init() {
        const res = await fetch("https://mp3quran.net/api/v3/reciters?language=ar");
        const data = await res.json();
        allReciters = data.reciters;
        populateReciters(allReciters);
        loadSurahs(false); 
    }

    function populateReciters(list) {
        reciterSelect.innerHTML = '<option value="">-- اختر القارئ --</option>';
        list.forEach(r => {
            if(r.moshaf && r.moshaf.length > 0) {
                const option = document.createElement('option');
                option.value = r.moshaf[0].server;
                option.text = r.name;
                reciterSelect.appendChild(option);
            }
        });
    }

    function loadSurahs(isAmmaOnly) {
        surahSelect.innerHTML = '';
        const start = isAmmaOnly ? 77 : 0; // جزء عم يبدأ من سورة النبأ (78)
        surahNames.forEach((name, index) => {
            if (index >= start || index === 0) { // نبقي الفاتحة دائماً
                const option = document.createElement('option');
                option.value = (index + 1).toString().padStart(3, '0');
                option.text = `${index + 1}. ${name}`;
                surahSelect.appendChild(option);
            }
        });
    }

    ammaBtn.onclick = () => {
        loadSurahs(true);
        ammaBtn.classList.add('active-mode');
        allBtn.classList.remove('active-mode');
        modeDesc.innerText = "وضع الأطفال: جزء عم فقط (من النبأ إلى الناس)";
    };

    allBtn.onclick = () => {
        loadSurahs(false);
        allBtn.classList.add('active-mode');
        ammaBtn.classList.remove('active-mode');
        modeDesc.innerText = "تصفح المصحف كاملاً";
    };

    searchInput.oninput = () => {
        const filtered = allReciters.filter(r => r.name.includes(searchInput.value));
        populateReciters(filtered);
    };

    playBtn.onclick = () => {
        const server = reciterSelect.value;
        const surah = surahSelect.value;
        if (!server || !surah) return alert("اختر القارئ والسورة");
        const url = `${server}${surah}.mp3`;
        if (audio.src !== url) { audio.src = url; audio.play(); playBtn.innerText = "⏸"; }
        else { audio.paused ? (audio.play(), playBtn.innerText = "⏸") : (audio.pause(), playBtn.innerText = "▶"); }
    };

    init();
</script>
</body>
</html>
